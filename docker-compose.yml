services:
  anystats:
    build: .
    container_name: anystats
    restart: unless-stopped
    ports:
      - "8100:8100"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    environment:
      ANYSTATS_SYNC_ENABLED: "true"
      ANYSTATS_CONFIG: "/app/config.yaml"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
